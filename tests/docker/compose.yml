# Run the whole suite in a container — no local install of Node, Chromium or any
# library required. From the repository root:
#
#   docker compose -f tests/docker/compose.yml run --rm tests
#
# To run one tier, pass your own command (a quoted glob discovers every file of
# that tier):
#
#   docker compose -f tests/docker/compose.yml run --rm tests \
#     node --test --test-concurrency=1 "tests/unit/**/*.test.mjs"
#
# A local run uses the image's baked copy of the repo, so it writes nothing to
# your working tree. To test an edit, rebuild (the COPY layer is the only one
# that invalidates, so it takes a second or two):
#
#   docker compose -f tests/docker/compose.yml run --rm --build tests
#
# The image is built on first use and cached afterwards; rebuild it on its own
# with `docker compose -f tests/docker/compose.yml build`.
services:
  tests:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
    # Chromium needs more shared memory than the 64 MB default, or it crashes
    # mid-suite on a large page.
    shm_size: 1gb
    # The tests bind loopback ports and drive a headless browser; they need no
    # network egress beyond the npm/browser install already baked into the image.
    init: true
    working_dir: /app
    # NO bind mount and NO volumes: the image COPYs the checkout at build time
    # and carries its own node_modules and browser build, so a run uses the
    # baked copy and writes NOTHING to your working tree. That is deliberate:
    #
    #   * a bind mount of the repo would shadow the image's node_modules and
    #     browser, and would make a local run test your host files while CI
    #     tests the baked ones — two different subjects;
    #   * shadowing node_modules with a volume recreates an empty node_modules/
    #     directory in the checkout as a side effect of every run, and a
    #     persistent volume then goes stale after a dependency change.
    #
    # So a local run and a CI run are the same subject and the same command.
    # To pick up an edit, rebuild — the COPY layer is the only one that
    # invalidates, so it is a second or two:
    #
    #   docker compose -f tests/docker/compose.yml run --rm --build tests
    environment:
      NODE_NO_WARNINGS: "1"
    # The quoted glob is expanded by the test runner itself; a bare directory
    # argument is not accepted here (it fails with MODULE_NOT_FOUND).
    command: ["node", "--test", "--test-concurrency=1", "--test-timeout=60000", "tests/**/*.test.mjs"]
